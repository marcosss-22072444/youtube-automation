# config.yaml
# Configuración NO sensible del proyecto. Este archivo SÍ se sube a Git.
# Los secretos (API keys, tokens) van en .env, nunca aquí.

log_level: "INFO"

ai_provider: "gemini"   # Proveedor de IA de texto activo (más adelante podremos cambiarlo aquí)
log_level: "INFO"
ai_provider: "gemini"
gemini_model: "gemini-3.6-flash"
ideas_context_limit: 50
narration_wpm: 150

script_duration_seconds:
  short: 35
  long: 600

groq_model: "openai/gpt-oss-120b"
image_generation:
  width: 768
  height: 768
  num_inference_steps: 20
  guidance_scale: 7.0

  voice_naturalness:
  speed: 0.95
  pause_between_segments_ms: 200

video:
  scene_duration:
    short:
      min_seconds: 1.5
      max_seconds: 2.0
    long:
      min_seconds: 4.0
      max_seconds: 6.0
  ken_burns:
    enabled: true
    zoom_start: 1.0
    zoom_end: 1.15
    pan_enabled: true
  subtitles:
    enabled: true
    export_srt: true
    burn_in: true
    font_size: 60
    font_color: "yellow"
    outline_color: "black"
    outline_width: 3
    position: "bottom"
    max_lines: 2
    animation: "none"
    media_sources:
      order: ["pexels", "pixabay", "sdxl"]
      clip_duration_seconds:
        min: 1.5
        max: 2.0
    avoid_repetition: true
    candidates_per_search: 5
text_normalization:
  use_ai_pass: true
  unit_expansions:
    "km/h": "kilómetros por hora"
    "km": "kilómetros"
    "kg": "kilogramos"
    "cm": "centímetros"
    "mm": "milímetros"
    "hp": "caballos de fuerza"
    "mph": "millas por hora"
    "kmh": "kilómetros por hora"
media_sources:
  order: ["pexels", "pixabay", "sdxl"]
  avoid_repetition: true
  candidates_per_search: 5
  request_delay_seconds:
    min: 2.0
    max: 3.0
  pause_every_n_scenes: 30
  pause_seconds:
    min: 15.0
    max: 30.0
thumbnails:
  dimensions:
    short:
      width: 1080
      height: 1920
    long:
      width: 1280
      height: 720
  font_path: "assets/fonts/Anton-Regular.ttf"
  font_size: "auto"
  max_font_size: 140
  min_font_size: 60
  font_color: "auto"
  outline_width: 8
  max_lines: 3